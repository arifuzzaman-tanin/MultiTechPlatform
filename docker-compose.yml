services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multitech-platform-api
    depends_on:
      database:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Server=database,1433;Database=MultiTechPlatform;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Your_password123};TrustServerCertificate=True;Encrypt=False;
      Database__ApplyMigrationsOnStartup: "true"
      Jwt__Issuer: MultiTech.Platform
      Jwt__Audience: MultiTech.Platform.Api
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-DevelopmentOnlySigningKeyChangeOutsideSourceControl12345}
      Jwt__AccessTokenLifetimeMinutes: 15
      Jwt__RefreshTokenLifetimeDays: 7
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: multitech-platform-database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_password123}
    ports:
      - "${SQL_SERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver-data:
